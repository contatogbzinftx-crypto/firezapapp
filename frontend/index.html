<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔥 FireZap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0f; }
        .gradient-text { background: linear-gradient(135deg, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; transition: all 0.3s; }
        .card:hover { border-color: #f97316; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-connected { background: #22c55e; box-shadow: 0 0 12px #22c55e88; }
        .status-connecting { background: #eab308; animation: pulse 1s infinite; }
        .status-disconnected { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .message-bubble { background: #2a2a4a; border-radius: 12px; padding: 8px 14px; margin: 4px 0; }
        .message-bubble-1 { border-left: 3px solid #f97316; }
        .message-bubble-2 { border-left: 3px solid #ef4444; }
        .log-container { max-height: 400px; overflow-y: auto; }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: #1a1a2e; }
        .log-container::-webkit-scrollbar-thumb { background: #f97316; border-radius: 3px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
        <div class="card p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <h1 class="text-4xl font-bold text-white">🔥 <span class="gradient-text">FireZap</span></h1>
                <p class="text-gray-400 text-sm mt-2">Digite o código de acesso para entrar</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-sm block mb-1">Nome de usuário</label>
                    <input type="text" id="loginUser" placeholder="Ex: João"
                           class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-orange-500 outline-none" />
                </div>

                <div>
                    <label class="text-gray-400 text-sm block mb-1">Código secreto</label>
                    <input type="password" id="loginCode" placeholder="••••"
                           class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-orange-500 outline-none"
                           onkeydown="if(event.key==='Enter') doLogin()" />
                </div>

                <button onclick="doLogin()" class="w-full bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white py-3 rounded-lg font-bold transition">
                    🔓 Entrar
                </button>

                <p id="loginError" class="text-red-400 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- ===== TELA PRINCIPAL ===== -->
    <div id="mainScreen" class="hidden min-h-screen p-6">
        <div class="max-w-6xl mx-auto">

            <!-- Header -->
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white">🔥 <span class="gradient-text">FireZap</span></h1>
                    <p class="text-gray-400 text-sm mt-1">Olá, <span id="userNameDisplay" class="text-orange-400 font-semibold"></span>! Conecte 2 chips e ative a conversa.</p>
                </div>
                <div class="flex items-center gap-4">
                    <span id="conversationStatus" class="text-gray-400 text-sm">⏸️ Pausado</span>
                    <span class="text-gray-600 text-sm" id="timeDisplay"></span>
                    <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm transition">Sair</button>
                </div>
            </header>

            <!-- Grid principal -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                <!-- Chip 1 -->
                <div class="card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-3">
                            <span class="status-dot status-disconnected" id="statusDot1"></span>
                            <h2 class="text-white font-bold">Chip 1</h2>
                        </div>
                        <span id="phoneNumber1" class="text-gray-400 text-sm">Não conectado</span>
                    </div>

                    <div id="qrContainer1" class="hidden bg-white rounded-lg p-2 mb-4 flex flex-col justify-center items-center">
                        <img id="qr1" src="" alt="QR Code" class="w-48 h-48" />
                        <p class="text-xs text-gray-500 text-center mt-2">Escaneie com o WhatsApp</p>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="connectChip(1)" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                            📱 Conectar
                        </button>
                        <button onclick="disconnectChip(1)" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 px-4 py-2 rounded-lg text-sm font-semibold transition">
                            Desconectar
                        </button>
                    </div>
                </div>

                <!-- Chip 2 -->
                <div class="card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-3">
                            <span class="status-dot status-disconnected" id="statusDot2"></span>
                            <h2 class="text-white font-bold">Chip 2</h2>
                        </div>
                        <span id="phoneNumber2" class="text-gray-400 text-sm">Não conectado</span>
                    </div>

                    <div id="qrContainer2" class="hidden bg-white rounded-lg p-2 mb-4 flex flex-col justify-center items-center">
                        <img id="qr2" src="" alt="QR Code" class="w-48 h-48" />
                        <p class="text-xs text-gray-500 text-center mt-2">Escaneie com o WhatsApp</p>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="connectChip(2)" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                            📱 Conectar
                        </button>
                        <button onclick="disconnectChip(2)" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 px-4 py-2 rounded-lg text-sm font-semibold transition">
                            Desconectar
                        </button>
                    </div>
                </div>

            </div>

            <!-- Controles -->
            <div class="card p-6 mt-6">
                <div class="flex flex-wrap gap-4 items-center">
                    <div class="flex-1 min-w-[200px]">
                        <label class="text-gray-400 text-sm block mb-1">Texto base</label>
                        <input type="text" id="baseText" value="Olá, tudo bem? Como você está?"
                               class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-2 text-white text-sm focus:border-orange-500 outline-none" />
                    </div>
                    <div class="flex gap-2">
                        <button id="btnStart" onclick="startConversation()" class="bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white px-6 py-2 rounded-lg font-bold transition opacity-50 cursor-not-allowed" disabled>
                            ▶️ Iniciar
                        </button>
                        <button onclick="pauseConversation()" class="bg-yellow-600/20 hover:bg-yellow-600/30 text-yellow-400 px-6 py-2 rounded-lg font-bold transition">
                            ⏸️ Pausar
                        </button>
                        <button onclick="stopConversation()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 px-6 py-2 rounded-lg font-bold transition">
                            ⏹️ Parar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Log -->
            <div class="card p-6 mt-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-white font-bold">📋 Log de Conversa</h3>
                    <button onclick="clearLogsUI()" class="text-gray-400 text-sm hover:text-white transition">Limpar</button>
                </div>
                <div id="logContainer" class="log-container space-y-1 text-sm">
                    <div class="text-gray-500 text-center py-8">Aguardando mensagens...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ===== Estado global =====
        let currentUser = null;
        let accessCode = null;
        let roomId = null;
        const pollIntervals = { 1: null, 2: null };
        let logInterval = null;
        let chipStatus = { 1: 'disconnected', 2: 'disconnected' };

        // ===== Verifica login salvo =====
        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('firezap_user');
            const savedCode = localStorage.getItem('firezap_code');
            if (savedUser && savedCode) {
                currentUser = savedUser;
                accessCode = savedCode;
                roomId = 'room_' + savedUser.toLowerCase().replace(/[^a-z0-9]/g, '_');
                showMainScreen();
            }
        });

        // ===== LOGIN =====
        async function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!user || !code) {
                errorEl.textContent = 'Preencha todos os campos';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = user;
                    accessCode = code;
                    roomId = 'room_' + user.toLowerCase().replace(/[^a-z0-9]/g, '_');

                    localStorage.setItem('firezap_user', user);
                    localStorage.setItem('firezap_code', code);

                    showMainScreen();
                } else {
                    errorEl.textContent = data.error || 'Código inválido';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'Erro ao conectar: ' + error.message;
                errorEl.classList.remove('hidden');
            }
        }

        function showMainScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('userNameDisplay').textContent = currentUser;
            updateStartButton();

            setTimeout(() => {
                startPolling(1);
                startPolling(2);
                startLogPolling();
            }, 500);
        }

        function logout() {
            if (!confirm('Sair? Seus chips continuarão conectados no servidor.')) return;
            localStorage.removeItem('firezap_user');
            localStorage.removeItem('firezap_code');
            location.reload();
        }

        // ===== Helper: fetch com auth + room =====
        async function apiFetch(url, options = {}) {
            const separator = url.includes('?') ? '&' : '?';
            const fullUrl = `${url}${separator}room=${encodeURIComponent(roomId)}`;
            const headers = { 'Content-Type': 'application/json', 'x-access-code': accessCode, ...(options.headers || {}) };
            return fetch(fullUrl, { ...options, headers });
        }

        // ===== Conectar chip =====
        async function connectChip(chipId) {
            if (chipStatus[chipId] === 'connected' || chipStatus[chipId] === 'connecting') {
                alert(`Chip ${chipId} já está conectado ou conectando!`);
                return;
            }

            try {
                const response = await apiFetch(`/api/connect/${chipId}`, { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    addLogItem('system', `📱 Chip ${chipId} conectando... Aguarde o QR Code`);
                    startPolling(chipId);
                } else {
                    alert(`Erro: ${data.error}`);
                }
            } catch (error) {
                alert('Erro ao conectar: ' + error.message);
            }
        }

        // ===== Desconectar chip =====
        async function disconnectChip(chipId) {
            if (!confirm(`Desconectar Chip ${chipId}?`)) return;
            try {
                await apiFetch(`/api/disconnect/${chipId}`, { method: 'POST' });
                chipStatus[chipId] = 'disconnected';
                updateStatus(chipId, 'disconnected');
                document.getElementById(`phoneNumber${chipId}`).textContent = 'Não conectado';
                document.getElementById(`qrContainer${chipId}`).classList.add('hidden');
                if (pollIntervals[chipId]) { clearInterval(pollIntervals[chipId]); pollIntervals[chipId] = null; }
                addLogItem('system', `Chip ${chipId} desconectado`);
                updateStartButton();
            } catch (error) {
                alert('Erro ao desconectar: ' + error.message);
            }
        }

        // ===== Polling por chip =====
        function startPolling(chipId) {
            if (pollIntervals[chipId]) clearInterval(pollIntervals[chipId]);
            chipStatus[chipId] = 'connecting';
            updateStatus(chipId, 'connecting');

            pollIntervals[chipId] = setInterval(async () => {
                try {
                    const response = await apiFetch(`/api/status/${chipId}`);
                    const data = await response.json();

                    if (data.qr) {
                        document.getElementById(`qr${chipId}`).src = data.qr;
                        document.getElementById(`qrContainer${chipId}`).classList.remove('hidden');
                    }

                    if (data.status === 'connected') {
                        document.getElementById(`qrContainer${chipId}`).classList.add('hidden');
                        document.getElementById(`phoneNumber${chipId}`).textContent = data.phoneNumber ? `+${data.phoneNumber}` : 'Conectado';
                        chipStatus[chipId] = 'connected';
                        updateStatus(chipId, 'connected');
                        updateStartButton();
                    } else if (data.status === 'awaiting_scan') {
                        chipStatus[chipId] = 'connecting';
                        updateStatus(chipId, 'connecting');
                    } else if (data.status === 'disconnected') {
                        chipStatus[chipId] = 'disconnected';
                        updateStatus(chipId, 'disconnected');
                        updateStartButton();
                    }
                } catch (error) {
                    console.error('Erro status:', error);
                }
            }, 2000);
        }

        function updateStatus(chipId, status) {
            const dot = document.getElementById(`statusDot${chipId}`);
            dot.className = 'status-dot';
            if (status === 'connected') dot.classList.add('status-connected');
            else if (status === 'connecting') dot.classList.add('status-connecting');
            else dot.classList.add('status-disconnected');
        }

        function updateStartButton() {
            const btn = document.getElementById('btnStart');
            const ready = chipStatus[1] === 'connected' && chipStatus[2] === 'connected';
            btn.disabled = !ready;
            btn.classList.toggle('opacity-50', !ready);
            btn.classList.toggle('cursor-not-allowed', !ready);
        }

        // ===== Conversa =====
        async function startConversation() {
            if (chipStatus[1] !== 'connected' || chipStatus[2] !== 'connected') {
                alert('Conecte os dois chips primeiro!');
                return;
            }
            const text = document.getElementById('baseText').value;
            try {
                const response = await apiFetch('/api/conversation/start', { method: 'POST', body: JSON.stringify({ text }) });
                const data = await response.json();
                if (data.success || data.message) {
                    document.getElementById('conversationStatus').textContent = '▶️ Ativa';
                    document.getElementById('conversationStatus').className = 'text-green-400 text-sm';
                    addLogItem('system', '🚀 Conversa iniciada! Ping-pong rodando...');
                } else {
                    alert(`Erro: ${data.error}`);
                }
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        async function pauseConversation() {
            try {
                await apiFetch('/api/conversation/pause', { method: 'POST' });
                const s = document.getElementById('conversationStatus');
                s.textContent = '⏸️ Pausado';
                s.className = 'text-yellow-400 text-sm';
                addLogItem('system', '⏸️ Conversa pausada');
            } catch (error) { alert('Erro: ' + error.message); }
        }

        async function stopConversation() {
            try {
                await apiFetch('/api/conversation/stop', { method: 'POST' });
                const s = document.getElementById('conversationStatus');
                s.textContent = '⏹️ Parado';
                s.className = 'text-gray-400 text-sm';
                document.getElementById('logContainer').innerHTML = '<div class="text-gray-500 text-center py-8">Conversa resetada</div>';
            } catch (error) { alert('Erro: ' + error.message); }
        }

        // ===== Log polling =====
        function startLogPolling() {
            if (logInterval) clearInterval(logInterval);
            logInterval = setInterval(async () => {
                try {
                    const response = await apiFetch('/api/logs');
                    const logs = await response.json();

                    const container = document.getElementById('logContainer');
                    if (logs.length === 0) {
                        if (!container.querySelector('.text-center')) {
                            container.innerHTML = '<div class="text-gray-500 text-center py-8">Aguardando mensagens...</div>';
                        }
                        return;
                    }

                    container.innerHTML = logs.map(log => {
                        const chip = log.chip === '1' ? 'Chip 1' : 'Chip 2';
                        const cls = log.chip === '1' ? 'message-bubble-1' : 'message-bubble-2';
                        const time = new Date(log.timestamp).toLocaleTimeString();
                        return `<div class="message-bubble ${cls}">
                            <span class="text-gray-400 text-xs">${time}</span>
                            <span class="text-orange-400 font-semibold">[${chip}]</span>
                            <span class="text-white">${escapeHtml(log.text)}</span>
                        </div>`;
                    }).join('');

                    container.scrollTop = container.scrollHeight;
                } catch (error) {
                    console.error('Erro logs:', error);
                }
            }, 1500);
        }

        function addLogItem(type, text) {
            const container = document.getElementById('logContainer');
            if (container.querySelector('.text-center')) container.innerHTML = '';
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'message-bubble border-l-4 border-green-500';
            div.innerHTML = `<span class="text-gray-400 text-xs">${time}</span> <span class="text-green-400">${escapeHtml(text)}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearLogsUI() {
            document.getElementById('logContainer').innerHTML = '<div class="text-gray-500 text-center py-8">Logs limpos</div>';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Relógio
        setInterval(() => {
            const el = document.getElementById('timeDisplay');
            if (el) el.textContent = new Date().toLocaleTimeString();
        }, 1000);
    </script>

</body>
</html>
